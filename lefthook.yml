pre-commit:
  jobs:
    - run: pnpm ultracite fix {stage_fixed}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.py"
        - "**/*.css"
      stage_fixed: true

prepare-commit-msg:
  commands:
    commitizen:
      interactive: true
      run: pnpm commit --hook
      env:
        LEFTHOOK: "0"

commit-msg:
  commands:
    "lint commit message":
      run: pnpm commitlint --edit {1}
