syntax = "proto3";

package nexacore.payments.v1;

option go_package = "github.com/kingsonseang/nexacore-financial/ledger-service/gen/nexacore/payments/v1;paymentsv1";

service PaymentsService {
  rpc CreateDepositIntent(CreateDepositIntentRequest) returns (CreateDepositIntentResponse);
  rpc CreateWithdrawIntent(CreateWithdrawIntentRequest) returns (CreateWithdrawIntentResponse);
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (GetPaymentStatusResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
}

enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_NGN = 1;
  CURRENCY_USD = 2;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PROCESSING = 2;
  PAYMENT_STATUS_COMPLETED = 3;
  PAYMENT_STATUS_FAILED = 4;
}

enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PAYMENT_TYPE_DEPOSIT = 1;
  PAYMENT_TYPE_WITHDRAWAL = 2;
}

message Payment {
  string payment_id = 1;
  string user_id = 2;
  string amount = 3;
  Currency currency = 4;
  PaymentStatus status = 5;
  PaymentType type = 6;
  string reference = 7;
  string created_at = 8;
}

message CreateDepositIntentRequest {
  string user_id = 1;
  string amount = 2;
  Currency currency = 3;
  string email = 4;
}

message CreateDepositIntentResponse {
  string payment_id = 1;
  string payment_url = 2;
  string reference = 3;
}

message CreateWithdrawIntentRequest {
  string user_id = 1;
  string amount = 2;
  Currency currency = 3;
  string bank_code = 4;
  string account_number = 5;
}

message CreateWithdrawIntentResponse {
  string payment_id = 1;
  string reference = 2;
}

message GetPaymentStatusRequest {
  string payment_id = 1;
  string user_id = 2;
}

message GetPaymentStatusResponse {
  Payment payment = 1;
}

message ListPaymentsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  int32 total = 2;
}
