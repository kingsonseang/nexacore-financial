launchTemplates:
  linux-bun:
    resourceClass: linux-medium-js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --no-cache

      - run: bunx nx-cloud start-agent