services:
  minio:
    image: minio/minio:latest
    container_name: nexacore-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nexacore
      MINIO_ROOT_PASSWORD: nexacore123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:latest
    container_name: nexacore-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo.yaml
    command: -config.file=/etc/tempo.yaml
    depends_on:
      minio:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: nexacore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command: --config.file=/etc/prometheus/prometheus.yaml

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: nexacore-otel-collector
    ports:
      - "4318:4318"
    volumes:
      - ../otel/otel-collector.yaml:/etc/otel/config.yaml
    command: --config=/etc/otel/config.yaml
    depends_on:
      - tempo
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: nexacore-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - tempo
      - prometheus

volumes:
  minio_data:
  grafana_data:
